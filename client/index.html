<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Solana Live</title>
  <meta name="description" content="The Solana network, live: every block, every trade, as it happens.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Solana Live">
  <meta property="og:description" content="The Solana network, live: every block, every trade, as it happens.">
  <meta property="og:image" content="https://solanacompass.com/images/3d-blocks-preview.webp">
  <meta property="og:url" content="https://live.solanacompass.com">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Solana Live">
  <meta name="twitter:description" content="The Solana network, live: every block, every trade, as it happens.">
  <meta name="twitter:image" content="https://solanacompass.com/images/3d-blocks-preview.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #22e6ff; --magenta: #ff2bd6; --gold: #ffc23d; --violet: #b9a6ff; --hot: #ff3b6b;
      --accent: var(--magenta); --head: var(--cyan); --dim: var(--violet);
      --font: 'Share Tech Mono', ui-monospace, monospace;
    }
    /* WarGames: green phosphor terminal */
    body[data-preset="validators"] { --accent: #ffb000; --head: #39ff7a; --dim: #1f9a4a; --gold: #ffb000; --font: 'VT323', 'Share Tech Mono', monospace; }
    body[data-preset="validators"] .hud { font-size: 1.15em; }
    /* Tron: cyan and orange */
    body[data-preset="spectrum"] { --accent: #ff7a18; --head: #18e8ff; --dim: #4fa9b8; --gold: #ff7a18; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #06010f; overflow: hidden; color: #fff; font-family: var(--font); }
    #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    .hud { position: fixed; pointer-events: none; letter-spacing: 0.08em; font-family: var(--font); }
    .hud a, .hud button { pointer-events: auto; }
    .label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.2em; }

    #brand { top: max(18px, env(safe-area-inset-top)); left: 22px; }
    #brand .title { font-family: Orbitron, sans-serif; font-weight: 900; font-size: 15px; letter-spacing: 0.35em; color: #fff; }
    #brand .title em { font-style: normal; color: var(--accent); }
    #brand .slot { font-family: Orbitron, sans-serif; font-weight: 500; font-size: 26px; color: var(--head); margin-top: 6px; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px currentColor; }
    #brand .meta { font-size: 12px; color: var(--dim); margin-top: 2px; }
    #brand .meta b { color: #fff; font-weight: normal; }

    #status { top: max(18px, env(safe-area-inset-top)); right: 22px; text-align: right; font-size: 12px; color: var(--dim); }
    #link { color: var(--head); }
    #link::before { content: '●'; margin-right: 6px; animation: blink 1.2s steps(2) infinite; }
    #link.down { color: var(--hot); }
    #delay { display: block; margin-top: 4px; }
    #status a { display: inline-block; margin-top: 10px; color: var(--gold); text-decoration: none; border: 1px solid currentColor; padding: 4px 8px; opacity: 0.85; }
    #status a:hover { opacity: 1; }
    @keyframes blink { 50% { opacity: 0.2; } }
    #filter { display: block; margin: 8px 0 0 auto; background: none; border: 1px solid var(--dim); color: var(--dim); font: inherit; font-size: 11px; letter-spacing: 0.12em; padding: 4px 8px; cursor: pointer; }
    #filter::before { content: '◇ '; }
    body:not([data-filter="all"]) #filter { color: #fff; border-color: #fff; background: rgba(255, 255, 255, 0.08); }
    body:not([data-filter="all"]) #filter::before { content: '◆ '; }

    #switcher { top: max(18px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); text-align: center; }
    #switcher .row { display: flex; align-items: center; gap: 12px; }
    #switcher button { background: none; border: 1px solid var(--dim); color: var(--head); font: inherit; width: 26px; height: 22px; cursor: pointer; opacity: 0.7; }
    #switcher button:hover { opacity: 1; }
    #preset-name { font-family: Orbitron, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.35em; color: #fff; min-width: 150px; }
    #preset-dots { font-size: 9px; color: var(--dim); margin-top: 4px; letter-spacing: 0.3em; }
    #auto { display: none; font-size: 9px; color: var(--accent); margin-top: 2px; }
    #auto.on { display: block; }

    #kpis { left: 50%; transform: translateX(-50%); bottom: max(22px, env(safe-area-inset-bottom)); display: flex; gap: 34px; }
    .kpi { text-align: center; min-width: 120px; }
    .kpi .v { font-family: Orbitron, sans-serif; font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums; text-shadow: 0 0 12px currentColor; }
    .kpi .label { margin-top: 2px; }

    #feed { left: 22px; top: calc(max(18px, env(safe-area-inset-top)) + 96px); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
    #feed .row { display: flex; gap: 10px; animation: in 0.5s ease-out; opacity: 0.95; white-space: nowrap; }
    #feed .row:nth-child(n+2) { opacity: 0.6; }
    #feed .row:nth-child(n+4) { opacity: 0.35; }
    #feed b { color: var(--gold); font-weight: normal; min-width: 64px; }
    #feed span { color: #fff; }
    #feed i { color: var(--dim); font-style: normal; }
    #feed em { font-style: normal; }
    #feed.windows .row { gap: 8px; }
    #feed.windows span { color: var(--head); min-width: 92px; }
    #feed.windows em.ok { color: var(--head); letter-spacing: -0.1em; }
    #feed.windows em.skip { color: #ff3a3a; }
    #feed.windows b { min-width: 40px; text-align: right; }
    @keyframes in { from { transform: translateX(-12px); opacity: 0; } }

    #legend { right: 22px; bottom: max(22px, env(safe-area-inset-bottom)); font-size: 11px; color: var(--dim); line-height: 1.75; text-align: right; }
    #legend i { display: inline-block; width: 8px; height: 8px; margin-left: 7px; vertical-align: 0; }

    /* Annotation layer: thin leader lines to small bracketed labels */
    #overlay { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    #overlay svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #overlay polyline { fill: none; stroke: rgba(255, 190, 130, 0.65); stroke-width: 1; }
    .callout { position: absolute; left: 0; top: 0; font-family: 'Share Tech Mono', monospace; font-size: 11px; line-height: 1.35;
      padding: 4px 7px; border-left: 2px solid #ffa24a; background: rgba(4, 7, 13, 0.72); color: #d7e3f4; white-space: nowrap; }
    .callout b { display: block; font-family: Orbitron, sans-serif; font-weight: 700; font-size: 13px; color: #fff; letter-spacing: 0.06em; }
    .callout span { display: block; color: #ffa24a; font-size: 15px; }
    .callout i { font-style: normal; color: #8ea3bf; }
    .callout.tower { border-left-color: #cfe4ff; }
    .callout em { display: block; font-style: normal; color: #ff6a8a; font-size: 10px; letter-spacing: 0.1em; }
    .callout.tower b { font-size: 11px; }
    #hero { position: fixed; left: 0; right: 0; top: 40%; text-align: center; pointer-events: none; opacity: 0;
      font-family: Orbitron, sans-serif; font-weight: 900; font-size: clamp(36px, 8vw, 120px); letter-spacing: 0.02em; color: #fff;
      text-shadow: 0 0 30px rgba(255, 162, 74, 0.6); }
    #hero.slam { animation: slam 2.4s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes slam {
      0% { opacity: 0; transform: scale(1.6); filter: blur(12px); }
      12% { opacity: 1; transform: scale(1); filter: blur(0); }
      70% { opacity: 1; transform: scale(0.97); }
      100% { opacity: 0; transform: scale(0.94) translateY(-30px); }
    }
    /* Alpenglow: blue hour and rose light */
    body[data-preset="alpenglow"] { --accent: #ff8fa8; --head: #ffd2c2; --dim: #9aa3c7; --gold: #ffd27a; }
    body[data-preset="alpenglow"] #overlay polyline { stroke: rgba(255, 170, 190, 0.6); }
    .callout.alp { border-left-color: #ff8fa8; }
    .callout.alp span { color: #ffd27a; }
    body[data-preset="city"] { --accent: #ffa24a; --head: #cfe4ff; --dim: #8ea3bf; --gold: #ffa24a; }

    @media (max-width: 900px) {
      #kpis { gap: 14px; bottom: max(14px, env(safe-area-inset-bottom)); width: calc(100% - 32px); justify-content: space-between; }
      .kpi { min-width: 0; }
      .kpi .v { font-size: 18px; }
      .kpi .label { font-size: 9px; letter-spacing: 0.1em; }
      #feed { top: calc(max(18px, env(safe-area-inset-top)) + 82px); left: 16px; font-size: 11px; }
      #legend { display: none; }
      #brand { left: 16px; } #status { right: 16px; }
      #brand .slot { font-size: 20px; }
      #brand .meta { font-size: 10px; }
      #status a { font-size: 10px; padding: 3px 6px; margin-top: 6px; }
      #status { font-size: 10px; }
      #switcher { top: auto; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 52px); }
      #preset-name { font-size: 11px; min-width: 120px; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <div class="hud" id="brand">
    <div class="title">SOLANA<em>//</em>LIVE</div>
    <div class="slot" id="slot">—</div>
    <div class="meta">EPOCH <b id="epoch">—</b> · LEADER <b id="leader">—</b></div>
  </div>

  <div class="hud" id="switcher">
    <div class="row">
      <button id="prev" aria-label="Previous preset">◂</button>
      <div id="preset-name">—</div>
      <button id="next" aria-label="Next preset">▸</button>
    </div>
    <div id="preset-dots"></div>
    <div id="auto">AUTO-CYCLE</div>
  </div>

  <div class="hud" id="status">
    <span id="link"><span id="link-text">CONNECTING</span></span>
    <span id="delay">T−0.0s</span>
    <a href="https://solanacompass.com/analytics" target="_blank" rel="noopener">FULL ANALYTICS ↗</a>
    <button id="filter" title="Cycle trade filter · T tokenized · O organic"><span id="filter-state">ALL TOKENS</span></button>
  </div>

  <div class="hud" id="kpis"></div>
  <div class="hud" id="feed"></div>
  <div class="hud" id="legend"></div>
  <div id="overlay"><svg></svg></div>
  <div id="hero"></div>

  <a href="https://solanacompass.com" style="position:absolute;left:-9999px">Solana Compass</a>

  <script type="module" src="/src/next/main.ts"></script>
</body>
</html>
